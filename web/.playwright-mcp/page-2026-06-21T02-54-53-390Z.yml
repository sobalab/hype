    - generic [ref=e77]:
      - generic [ref=e78]: About HYP3
      - heading "We rank every team twice, then subtract." [level=2] [ref=e79]
      - generic [ref=e80]:
        - paragraph [ref=e81]: Twitter, ESPN, and Google all settle on a handful of favorites weeks before tipoff. The teams that actually win the bracket are usually a partial overlap. HYP3 plots both lists for the same 68 teams and shows where they don't match.
        - paragraph [ref=e82]: "For each team, we pull daily Google Trends search interest two ways: across the 15-day window around Selection Sunday (tournament mode), and across the full season from Nov 1 onward (season mode). Rank the field by hype, then again by wins, and the difference is the gap. Negative means overhyped. Positive means underhyped. Zero means the internet got it right."
