      - heading "Questions, answered." [level=2] [ref=e199]
      - generic [ref=e200]:
        - generic [ref=e201]:
          - button "How is hype measured?" [expanded] [ref=e202]:
            - generic [ref=e203]: How is hype measured?
            - img [ref=e204]
          - paragraph [ref=e207]: We pull daily Google Trends search interest for each team two ways. Tournament mode looks at the 15-day window around Selection Sunday. Trends scores are 0 to 100 within a single query, so values from different queries aren't directly comparable. We fix that by anchoring each batch of teams to a reference team (a year-round national program with reliable signal) and rescaling every other curve against the anchor's standalone curve, so the field is comparable. Season mode looks at the full season (roughly Nov 1 through Selection Sunday + 9 days) and pulls each team standalone, normalized within the team's own history. That makes season values comparable to a team's own past but not to other teams in absolute magnitude. Either way, a team's hype is the mean of its daily series.
        - button "What does the gap mean?" [ref=e209]:
